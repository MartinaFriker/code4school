category: Platinen
name: Calliope
description: Deutscher Einplatinen-Computer mit 5x5-Ledfeld (rot), Lage-/ Beschleunigungssensor, Licht-/ Temperatursensor, Kompass, analoge Anschlüsse, Lautsprecher, Mikrophon, 2 Tasten
advantages: Viele Funktionen und Sensoren, Unterrichtsmaterial auf Deutsch (Cornelsen und andere)
languages:
  - visuell/Blöcke
  - Python
  - Swift
  - Javascript
  - C++
ages:
  - 2. Zyklus
  - 3. Zyklus
  - Sekundarstufe 2
